name: Docker Registry Push

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/aws-devsecops-pipeline
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image Push Summary
        run: |
          echo "✅ Docker Image Pushed Successfully"
          echo "📦 Registry: GitHub Container Registry (GHCR)"
          echo "🏷️ Image: ghcr.io/${{ github.repository_owner }}/aws-devsecops-pipeline"
          echo "📋 Tags:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/   - /'
          echo ""
          echo "🔗 Pull command:"
          echo "   docker pull ghcr.io/${{ github.repository_owner }}/aws-devsecops-pipeline:latest"

  scan-image:
    name: Scan Image with Trivy
    needs: push-docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/aws-devsecops-pipeline:latest
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: 'trivy'

      - name: Trivy Scan Summary
        run: |
          echo "✅ Trivy Vulnerability Scan Completed"
          echo "📍 View results in GitHub Security tab: Settings → Security → Code scanning"

  notify:
    name: Workflow Summary
    needs: [push-docker, scan-image]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Status Report
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "            🐳 DOCKER PUSH WORKFLOW SUMMARY"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "📊 Job Status:"
          echo "   • Push Docker Image: ${{ needs.push-docker.result }}"
          echo "   • Scan with Trivy:   ${{ needs.scan-image.result }}"
          echo ""
          echo "📦 Image Details:"
          echo "   Repository: ${{ github.repository }}"
          echo "   Actor:      ${{ github.actor }}"
          echo "   Ref:        ${{ github.ref }}"
          echo "   SHA:        ${{ github.sha }}"
          echo ""
          echo "🔗 Links:"
          echo "   • Actions: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "   • Packages: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/aws-devsecops-pipeline"
          echo ""
          echo "═══════════════════════════════════════════════════════════"

      - name: Workflow Failed Alert
        if: needs.push-docker.result == 'failure' || needs.scan-image.result == 'failure'
        run: |
          echo "❌ WORKFLOW FAILED"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1