server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ecs-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: aws-devsecops-pipeline
          environment: production
          __path__: /var/log/app/*.log
